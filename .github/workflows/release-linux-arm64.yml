name: Release Linux ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    # Exécution sur runner ARM64 natif GitHub Actions (ou self-hosted)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Package binary
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar -czf ../../../digital_clock-linux-arm64.tar.gz digital_clock
          cd ../../..

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: digital_clock-linux-arm64.tar.gz
          generate_release_notes: true
