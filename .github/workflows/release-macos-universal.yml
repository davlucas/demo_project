name: Release macOS Universal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-universal:
    name: Build macOS Universal (ARM64 + Intel x86_64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple Silicon binary (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel binary (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary with lipo
        run: |
          mkdir -p dist
          lipo -create -output dist/digital_clock \
            target/aarch64-apple-darwin/release/digital_clock \
            target/x86_64-apple-darwin/release/digital_clock
          
          # Vérification de l'architecture universelle (Mach-O universal binary)
          file dist/digital_clock

      - name: Package binary (tar.gz)
        run: |
          tar -czf digital_clock-macos-universal.tar.gz -C dist digital_clock

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: digital_clock-macos-universal.tar.gz
          generate_release_notes: true
