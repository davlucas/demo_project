name: Release macOS Universal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-universal:
    name: Build macOS Universal App (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple Silicon binary (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel binary (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary with lipo
        run: |
          lipo -create -output digital_clock \
            target/aarch64-apple-darwin/release/digital_clock \
            target/x86_64-apple-darwin/release/digital_clock
          
          chmod +x digital_clock
          file digital_clock

      - name: Create macOS Application Bundle (.app)
        run: |
          APP_NAME="DigitalClock.app"
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          # Nettoyage du préfixe 'v' si présent (ex: v1.0.0 -> 1.0.0)
          CLEAN_VERSION="${VERSION#v}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          # Copie de l'exécutable universel dans Contents/MacOS
          cp digital_clock "$APP_NAME/Contents/MacOS/digital_clock"
          chmod +x "$APP_NAME/Contents/MacOS/digital_clock"

          # Génération du Info.plist standard macOS
          cat <<EOF > "$APP_NAME/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleName</key>
              <string>DigitalClock</string>
              <key>CFBundleDisplayName</key>
              <string>Digital Clock</string>
              <key>CFBundleExecutable</key>
              <string>digital_clock</string>
              <key>CFBundleIdentifier</key>
              <string>com.davlucas.digitalclock</string>
              <key>CFBundleVersion</key>
              <string>${CLEAN_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${CLEAN_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Création du ZIP officiel macOS préservant les attributs et permissions (.app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" DigitalClock-macos-universal.zip

          # Copie additionnelle du binaire brut standalone
          cp digital_clock digital_clock-macos-universal

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DigitalClock-macos-universal.zip
          generate_release_notes: true
